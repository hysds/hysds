[program:reap_orphaned_job_failed]
directory=/home/ops/mozart/ops/hysds/scripts
environment=PYTHONHTTPSVERIFY=0
; This daemon deletes production failure records, so deleting is opt-in:
; without --delete-orphans it only reports what it would delete. A venue
; adds that flag once it has reconciled a reporting sweep against its own
; audit. Copying this block into a PCM override and losing a flag can only
; make it quieter, never destructive.
; --lookback-days 1 matches HYSDS_JOB_STATUS_EXPIRES (one day): a longer
; window leaves the redis cross-check inert, which the daemon refuses when
; deleting unless --allow-expired-redis is given.
command=/home/ops/mozart/ops/hysds/scripts/reap_orphaned_job_failed.py -i 300 -g 120 --lookback-days 1
process_name=%(program_name)s
priority=1
numprocs=1
numprocs_start=0
redirect_stderr=true
stdout_logfile=%(here)s/../log/%(program_name)s.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
startsecs=10

